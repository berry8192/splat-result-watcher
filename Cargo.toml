[package]
name = "splat-result-watcher"
version = "0.1.0"
description = "スプラトゥーン3 の配信映像からリザルトを読み、WebSocket で流す"
authors = ["berry8192"]
edition = "2021"
publish = false
default-run = "splat-result-watcher"

[[bin]]
name = "splat-result-watcher"
path = "src/main.rs"

[[bin]]
name = "splat-result-watcher-gui"
path = "src/bin/gui.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
# GUI（src/bin/gui.rs）。画面は ui/ を Vite で組んだもの（ui/dist）を exe に埋め込む
# （custom-protocol: `cargo tauri` を通さずに cargo だけで組んでも ui/dist を使う）
tauri = { version = "2", features = ["custom-protocol"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = "0.3"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
strip = true
incremental = true

# 撮った画像の縮小・圧縮は debug だと桁違いに遅い。依存だけは debug でも最適化しておく
[profile.dev.package."*"]
opt-level = 3
